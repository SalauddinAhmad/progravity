name: PROGRAVITY Verify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  progravity-verify:
    name: PROGRAVITY Verification Gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and benchmark validator dependencies
        run: python -m pip install . -r benchmarks/runner/requirements.txt

      - name: Run unit and runtime tests
        run: python -m unittest discover -s tests -v

      - name: Audit schemas, manifest, hooks, and claims
        run: python benchmarks/runner/audit.py

      - name: Validate published benchmark fixtures, if any
        run: python benchmarks/runner/validate.py --episodes benchmarks/results --allow-empty

      - name: Compile native hook scripts
        run: python -m py_compile progravity_cli.py progravity_init.py plugins/progravity-antigravity/scripts/*.py skills/progravity/scripts/*.py benchmarks/runner/*.py

      - name: Smoke-test installed CLI
        run: progravity doctor

      - name: Package build and clean install smoke test
        run: |
          python -m pip install build
          python -m build --outdir /tmp/progravity-pkg
          python -m pip install --force-reinstall --no-deps /tmp/progravity-pkg/*.whl
          cd /tmp && progravity doctor
          cd /tmp && progravity decide --signals '{}'
          cd /tmp && python -c "import progravity_init; print(progravity_init.detect_hosts('.'))"

      - name: Validate portable skill structure
        run: python .github/scripts/validate_skill.py

      - name: Build and validate Native bundle
        run: |
          bash scripts/build-native-bundle.sh
          test -f dist/progravity-antigravity/plugin.json
          test -f dist/progravity-antigravity/hooks.json
          test -f dist/progravity-antigravity/skills/progravity/SKILL.md
          test -f dist/progravity-antigravity/skills/progravity-highstakes/SKILL.md
          test -f dist/progravity-antigravity/rules/progravity-invariants.md
          test -f dist/progravity-antigravity/scripts/pre_tool.py
          test -f dist/progravity-antigravity/scripts/progravity_action.py
          test -f dist/progravity-antigravity/scripts/progravity_policy.py
          test -f dist/progravity-antigravity/SHA256SUMS
          git diff --exit-code -- dist/progravity-antigravity

      - name: Validate public README claims
        run: python scripts/check_readme_claims.py

      - name: Success
        run: 'echo "VERDICT: PASS — all checks clean"'
