[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "progravity"
version = "4.0.0"
description = "Progravity reliability harness for Antigravity"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "jsonschema>=4.0.0",
  "PyYAML>=6.0",
  "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
progravity = "progravity_cli:main"

# Runtime assets mirrored under sys.prefix/share/progravity/ so the installed
# `progravity` console script works outside a repository checkout. Layout
# mirrors the repo root (plugins/..., skills/...); see installed_assets_root().
[tool.setuptools.data-files]
"share/progravity/plugins/progravity-antigravity" = [
  "plugins/progravity-antigravity/plugin.json",
  "plugins/progravity-antigravity/hooks.json",
]
"share/progravity/plugins/progravity-antigravity/scripts" = ["plugins/progravity-antigravity/scripts/*.py"]
"share/progravity/plugins/progravity-antigravity/rules" = ["plugins/progravity-antigravity/rules/*.md"]
"share/progravity/plugins/progravity-antigravity/agents" = ["plugins/progravity-antigravity/agents/*.md"]
"share/progravity/skills/progravity-highstakes" = ["skills/progravity-highstakes/*.md"]
"share/progravity/skills/progravity" = ["skills/progravity/SKILL.md", "skills/progravity/PROMPT-TEMPLATE.md", "skills/progravity/SESSION_FAILURES.md"]
"share/progravity/skills/progravity/agents" = ["skills/progravity/agents/*.md"]
"share/progravity/skills/progravity/references" = ["skills/progravity/references/*.md"]
"share/progravity/skills/progravity/resources" = ["skills/progravity/resources/*.md"]
"share/progravity/skills/progravity/scripts" = ["skills/progravity/scripts/*.py", "skills/progravity/scripts/*.sh"]
"share/progravity/schemas" = ["schemas/*.json"]
"share/progravity/adapters/opencode/agents" = ["adapters/opencode/agents/*.md"]
"share/progravity/adapters/opencode/plugin" = ["adapters/opencode/plugin/*.js"]
"share/progravity/adapters/opencode/permissions" = ["adapters/opencode/permissions/*.json"]
"share/progravity/adapters/opencode" = ["adapters/opencode/*.md", "adapters/opencode/*.json"]

[tool.setuptools]
py-modules = ["progravity_cli", "progravity_init"]
